<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字起こし結果レビュー</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 60px; background: #f3f4f7; color: #1b1e27;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { font-size: 12.5px; color: #5b6172; margin-bottom: 18px; }
  .meta code { background: #eceef3; padding: 1px 5px; border-radius: 4px; }
  .summary {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .summary .stat {
    background: #fff; border: 1px solid #dcdfe6; border-radius: 10px; padding: 10px 14px;
    font-size: 12.5px; color: #5b6172;
  }
  .summary .stat b { display: block; font-size: 18px; color: #1b1e27; }
  .summary .stat.warn b { color: #b91c1c; }
  .card {
    background: #fff; border: 1px solid #dcdfe6; border-radius: 12px;
    padding: 16px; margin-bottom: 12px;
  }
  .card.has-warning { border-color: #f3c14b; background: #fffaf0; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .qnum { font-weight: 700; font-size: 14px; }
  .fname { font-size: 11px; color: #8a90a0; }
  .qtext { font-size: 13.5px; line-height: 1.6; margin-bottom: 10px; white-space: pre-wrap; }
  .qtext.empty { color: #b91c1c; font-style: italic; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 6px; margin-bottom: 8px; }
  .choice { font-size: 12.5px; padding: 6px 8px; background: #f3f4f7; border-radius: 6px; }
  .choice.answer { background: #e4f7ea; font-weight: 700; }
  .choice.empty { color: #b91c1c; font-style: italic; background: #fdeaea; }
  .warnings { font-size: 11.5px; color: #b91c1c; }
  .empty-state { text-align: center; color: #5b6172; padding: 60px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>📝 文字起こし結果レビュー</h1>
    <div class="meta">
      データ元: <code>output/latest.json</code>(このファイルと同じフォルダに置いて開いてください)
    </div>
    <div class="summary" id="summary"></div>
    <div id="list"></div>
  </div>

  <script>
    const REQUIRED_FIELDS = ["question_text", "choice_a", "choice_b", "choice_c", "choice_d", "answer"];

    function escapeHtml(str) {
      return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function missingFields(item) {
      return REQUIRED_FIELDS.filter((f) => !item[f] || !String(item[f]).trim());
    }

    function renderCard(item) {
      const missing = missingFields(item);
      const hasWarning = missing.length > 0;
      const choiceLabel = (key, label) => {
        const value = item[key];
        const isAnswer = item.answer && label === item.answer;
        const empty = !value || !String(value).trim();
        return `<div class="choice${isAnswer ? " answer" : ""}${empty ? " empty" : ""}">${label}. ${empty ? "(空欄)" : escapeHtml(value)}</div>`;
      };
      return `
        <div class="card${hasWarning ? " has-warning" : ""}">
          <div class="card-head">
            <span class="qnum">${escapeHtml(item.question_number || "(問題番号なし)")}</span>
            <span class="fname">${escapeHtml(item.source_filename || "")}</span>
          </div>
          <div class="qtext${item.question_text ? "" : " empty"}">${item.question_text ? escapeHtml(item.question_text) : "(問題文が空です)"}</div>
          <div class="choices">
            ${choiceLabel("choice_a", "ア")}
            ${choiceLabel("choice_b", "イ")}
            ${choiceLabel("choice_c", "ウ")}
            ${choiceLabel("choice_d", "エ")}
          </div>
          ${hasWarning ? `<div class="warnings">⚠ 欠損フィールド: ${missing.join(", ")}</div>` : ""}
        </div>`;
    }

    function render(data) {
      const items = data.items || [];
      const withWarnings = items.filter((i) => missingFields(i).length > 0);
      document.getElementById("summary").innerHTML = `
        <div class="stat"><b>${items.length}</b>件</div>
        <div class="stat${withWarnings.length ? " warn" : ""}"><b>${withWarnings.length}</b>件 要確認</div>
        <div class="stat">生成日時: ${escapeHtml(data.generatedAt || "-")}</div>`;
      document.getElementById("list").innerHTML = items.length
        ? items.map(renderCard).join("")
        : `<div class="empty-state">items が空です</div>`;
    }

    fetch("output/latest.json", { cache: "no-store" })
      .then((res) => {
        if (!res.ok) throw new Error(`output/latest.json の取得に失敗しました(HTTP ${res.status})`);
        return res.json();
      })
      .then(render)
      .catch((err) => {
        document.getElementById("list").innerHTML =
          `<div class="empty-state">output/latest.json を読み込めませんでした。<br>まだ実行結果が無い場合は output/sample.json をコピーして<br>output/latest.json として置くと表示を確認できます。<br>(${escapeHtml(err.message)})</div>`;
      });
  </script>
</body>
</html>
